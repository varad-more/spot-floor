name: CI & Pages

# Two jobs, and neither one needs AWS credentials.
#
# `test` runs the offline suite. The `live` marker is excluded on purpose: those tests
# hit the real AWS API and are the correctness gates a developer runs locally with
# their own account. They are expected to run, just not here.
#
# `publish` deploys the snapshot already committed under `public/`. That snapshot is
# generated on a developer's machine with their own credentials
# (`scripts/snapshot.py --out public`), so there are no secrets in this repository and
# no way for CI to refresh the data. The page says when it was captured and tells the
# reader to clone and run it for live numbers -- a static page that implied live data
# would be the same unearned claim this project refuses to make about availability.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only `publish` gets `pages: write` and `id-token: write`. `test` installs and
# executes third-party dependency code, so it runs with a read-only token -- a
# compromised package in the tree should not be able to deploy the site.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Offline test suite
        run: uv run pytest -m "not live" -q

      # Proves the entry points import and parse their arguments without credentials.
      # Cheap, and it catches the class of breakage where a rename lands in the library
      # but not in the script users are told to run first -- which is exactly what
      # happened to `WebConfig.aws_regions` during the region pivot.
      - name: Entry points are runnable
        run: |
          uv run python scripts/scan.py --help > /dev/null
          uv run python scripts/serve.py --help > /dev/null
          uv run python scripts/snapshot.py --help > /dev/null
          uv run python -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/check_setup.py').read_text())"

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Scoped to this job, not the workflow. At workflow level the group also
    # covered `test`, so a third push while two runs were live cancelled the
    # middle one while it was still pending -- and that commit's tests never ran.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v5
