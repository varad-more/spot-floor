name: Publish snapshot to Pages

# GitHub Pages is a static host, so what gets published is a *snapshot*: a real
# poll of the providers, rendered to HTML and deployed. The page says so in its
# own banner -- a stale page that looks live is exactly the claim this project
# refuses to make elsewhere.
#
# Vast needs no credentials, so this works with zero configuration. AWS prices
# appear only if AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are set as repository
# secrets; without them the page renders Vast-only and states that AWS is not
# configured rather than showing an empty AWS section, which would read as "no
# capacity".

on:
  schedule:
    # Hourly. Note GitHub disables scheduled workflows after 60 days without
    # repository activity, and cron runs are best-effort under load.
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; never cancel one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SPOTFLOOR_DB: spotfloor.db
      # One bucket per scheduled run: with hourly polling, finer buckets would be
      # mostly empty and every sparkline would render as disconnected dots.
      SPOTFLOOR_HISTORY_HOURS: "24"
      SPOTFLOOR_BUCKETS: "24"
      SPOTFLOOR_AWS_REGIONS: us-east-1,us-west-2
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # The store is working state, not published output: it churns thousands of
      # segments per poll to render a ~100 KiB page. Keeping it in the cache is
      # what lets a sparkline span runs without pushing megabytes through Pages.
      # A cache miss costs history, not correctness -- the run still publishes.
      - name: Restore price history
        uses: actions/cache/restore@v4
        with:
          path: spotfloor.db
          key: spotfloor-db-${{ github.run_id }}
          restore-keys: spotfloor-db-

      - name: Verify the deterministic core before publishing anything
        run: uv run pytest -m "not live" -q

      - name: Poll providers and render the snapshot
        run: uv run python scripts/snapshot.py --out site

      # Cache keys are immutable, so save under a fresh one; restore-keys picks
      # up the newest on the next run.
      - name: Save price history
        uses: actions/cache/save@v4
        if: always()
        with:
          path: spotfloor.db
          key: spotfloor-db-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
