name: Publish snapshot to Pages

# GitHub Pages is a static host, so what gets published is a *snapshot*: a real
# read of the AWS spot API, rendered to HTML and deployed. The page says so in its
# own banner -- a stale page that looks live is exactly the claim this project
# refuses to make elsewhere.
#
# AWS credentials are required. Set AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY as
# repository secrets, scoped to a dedicated IAM user with only
# ec2:DescribeSpotPriceHistory, ec2:DescribeInstanceTypes and ec2:DescribeRegions.
# Without them the page still deploys and states that AWS is not configured rather
# than rendering an empty table, which would read as "no capacity".
#
# There is deliberately NO database cache. An earlier design kept the SQLite file
# in the Actions cache so history could span runs, which is necessary when a poller
# is the only source of history -- a poller cannot retroactively learn yesterday's
# price. AWS is not that: DescribeSpotPriceHistory retains ~89 days and serves them
# on request, and a full 30-day rebuild across 17 regions measures ~40s. So each run
# reconstructs everything it needs from the API, and a 62 MB cache round-trip buys
# nothing. The database is scratch space inside one job.

on:
  schedule:
    # Every 6 hours. The page charts a 7-day window from AWS's own history, so it
    # is full-depth on every run and does not need frequent polling to look right.
    # Note GitHub disables scheduled workflows after 60 days without repository
    # activity, and cron runs are best-effort under load.
    - cron: "17 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; never cancel one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SPOTFLOOR_DB: spotfloor.db
      # Regions are left unset so the provider discovers every region the account
      # has enabled -- a comparator that hardcodes a region list quietly stops
      # comparing the moment a new one is turned on.
      SPOTFLOOR_HISTORY_DAYS: "7"
      SPOTFLOOR_BACKFILL_DAYS: "30"
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Verify the deterministic core before publishing anything
        run: uv run pytest -m "not live" -q

      - name: Backfill history, poll, and render the snapshot
        run: uv run python scripts/snapshot.py --out site --backfill

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
