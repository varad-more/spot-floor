[project]
name = "spotfloor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Varad More", email = "varadmore1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "boto3>=1.43.46",
    "fastapi>=0.140.7",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits a real provider API. These are the correctness gates -- they validate normalization against live values rather than hand-invented fixtures, so they are expected to run, not skipped.",
]
